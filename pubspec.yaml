name: bienify_app
description: "Bienify — find doctors, consult from anywhere, get medicines delivered."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, DI and routing
  get: ^4.6.6

  # Responsive sizing against the 390x876 design canvas
  flutter_screenutil: ^5.9.3

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Maps — nearby cash-payment points, and live delivery tracking
  google_maps_flutter: ^2.9.0

  # The courier's own position, reported while they are carrying a parcel.
  # Without it nothing ever wrote `lastLocation`, so the customer's live map
  # had a route and no courier on it.
  geolocator: ^13.0.2

  # Media
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Camera / gallery capture behind every upload box
  image_picker: ^1.1.2

  # Live video consultation. The app never holds Agora credentials: the App ID
  # and a short-lived channel token both come from `POST /consultations/:id/join`.
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  socket_io_client: ^3.1.6
  file_picker: ^12.0.0
  video_player: ^2.11.1
  open_filex: ^4.7.0
  emoji_picker_flutter: ^4.4.0
  url_launcher: ^6.3.2

  # The ring. A call that arrives silently is a call that is missed, and until
  # this the app had no audio at all — an incoming consultation announced
  # itself only by whatever notification the OS drew.
  audioplayers: ^6.1.0
  vibration: ^3.1.3

  # The incoming call, when the app is not the thing on screen. Without a
  # notification the OS can raise, a call arriving while the phone is in a
  # pocket reached a route push nobody could see: the screen was there, behind
  # the launcher, and the callee found out by opening the app.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900

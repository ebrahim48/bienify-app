name: bienify_app
description: "Bienify — find doctors, consult from anywhere, get medicines delivered."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, DI and routing
  get: ^4.6.6

  # Responsive sizing against the 390x876 design canvas
  flutter_screenutil: ^5.9.3

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  logger: ^2.7.0

  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Maps — nearby cash-payment points
  google_maps_flutter: ^2.9.0

  # Media
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Camera / gallery capture behind every upload box
  image_picker: ^1.1.2
  # PDF/JPG/PNG document browsing (the "Attachment" / "Browse File" tiles,
  # as opposed to "Camera")
  file_picker: ^12.0.0

  # Live video consultation. The app never holds Agora credentials: the App ID
  # and a short-lived channel token both come from `POST /consultations/:id/join`.
  # Pinned below 6.5.2: 6.5.2+ imports AgoraPIPController.h from the plugin's
  # Swift Package Manager binary target, but that target is still pinned to
  # AgoraIrisRTC_iOS 4.5.2-build.1, which predates that header, so iOS builds
  # fail with "'AgoraRtcWrapper/AgoraPIPController.h' file not found".
  agora_rtc_engine: 6.5.1
  permission_handler: ^11.3.1
  socket_io_client: ^3.1.6
  file_picker: ^12.0.0
  video_player: ^2.11.1
  open_filex: ^4.7.0
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900

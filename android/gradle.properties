org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin's incremental compiler cannot handle plugin sources and the project
# living on different Windows drives. It stores paths relative to the module
# root, and `File.relativeTo` throws when the two have different roots:
#
#   this and base files have different roots:
#   C:\...\Pub\Cache\...\video_player_android-2.9.5\...\Messages.kt
#   and D:\Jakuan\Projects\Telemedicine\bienify-app\android
#
# The pub cache is on C: and this project is on D:, so every plugin written in
# Kotlin fails to build. Only the incremental *cache* is affected — this costs
# some rebuild speed and changes nothing about the output.
#
# The alternative is moving PUB_CACHE onto D:, which fixes it for this machine
# only; this travels with the repo.
kotlin.incremental=false
